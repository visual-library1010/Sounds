<!DOCTYPE html>

<title>Sound Charades</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    touch-action: manipulation;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    isolation: isolate;
}

/* The color revealed behind the black curtain */
#colorBackground {
    position: absolute;
    inset: 0;
    z-index: -2;
    background: rgb(40, 167, 69);
}

/* Black retreats downward by shrinking upward from the bottom */
#blackCurtain {
    position: absolute;
    inset: 0;
    background: #111;
    z-index: -1;
    height: 100%;
    pointer-events: none;
    will-change: height;
}

#word {
    width: 90%;
    padding: 20px;
    font-size: clamp(3rem, 8vw, 8rem);
    font-weight: bold;
    line-height: 1.1;
    overflow-wrap: anywhere;
    text-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: color .2s, opacity .12s;
}

#hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    color: #aaa;
    font-size: 1rem;
    letter-spacing: 1px;
    pointer-events: none;
}

#levelBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 5;
    padding: 12px 18px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #fff;
    color: #111;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
}

#levelBtn:active {
    transform: scale(.97);
}

body.level2 #word {
    color: orange;
}

#word.level1-word {
    color: white;
}

body.finished #hint {
    color: rgba(255,255,255,.85);
}

@media (max-width: 600px) {
    #word {
        font-size: clamp(2.5rem, 12vw, 5rem);
    }

    #levelBtn {
        top: 12px;
        right: 12px;
        padding: 10px 14px;
    }

    #hint {
        bottom: 18px;
        font-size: .85rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    #word {
        transition: none;
    }
}
</style>
</head>

<body>

<button id="levelBtn">Level 2</button>

// ==========================================
// GAME STATE
// ==========================================

const word = document.getElementById("word");
const hint = document.getElementById("hint");
const levelBtn = document.getElementById("levelBtn");
const curtain = document.getElementById("blackCurtain");
const colorBackground = document.getElementById("colorBackground");

let prompts = level1Prompts;
let bag = [];
let level2 = false;
let timerRunning = false;
let timerFinished = false;
let startTime = 0;
let animationFrame = null;
let currentPrompt = "";
let lastPrompt = "";
let audioContext = null;

// ==========================================
// RANDOM PROMPT ORDER
// ==========================================

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function refillBag() {
    bag = [...prompts];
    shuffle(bag);

    // Avoid repeating the previous prompt across reshuffles.
    if (bag.length > 1 && bag[bag.length - 1] === lastPrompt) {
        [bag[0], bag[bag.length - 1]] =
            [bag[bag.length - 1], bag[0]];
    }
}

function drawPrompt() {
    if (bag.length === 0) {
        refillBag();
    }

    lastPrompt = currentPrompt;
    currentPrompt = bag.pop();

    word.style.opacity = "0";

    setTimeout(() => {
        word.textContent = currentPrompt;
        word.style.opacity = "1";
    }, 100);
}

// ==========================================
// TIMER COLORS
// Progress 0.0 = start; 1.0 = time's up.
// ==========================================

function interpolateColor(a, b, amount) {
    const start = a.match(/\w\w/g).map(v => parseInt(v, 16));
    const end = b.match(/\w\w/g).map(v => parseInt(v, 16));

    const result = start.map((value, i) =>
        Math.round(value + (end[i] - value) * amount)
    );

    return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
}

function getTimerColor(progress) {
    const stops = [
        { at: 0.00, color: "28A745" }, // Green
        { at: 0.50, color: "E6D83B" }, // Yellow
        { at: 0.75, color: "F28C28" }, // Orange
        { at: 1.00, color: "D71920" }  // Red
    ];

    for (let i = 0; i < stops.length - 1; i++) {
        const first = stops[i];
        const second = stops[i + 1];

        if (progress <= second.at) {
            const localProgress =
                (progress - first.at) /
                (second.at - first.at);

            return interpolateColor(
                first.color,
                second.color,
                Math.max(0, Math.min(1, localProgress))
            );
        }
    }

    return "rgb(215, 25, 32)";
}

// ==========================================
// SOUND EFFECT — SHORT DING
// ==========================================

function playDing() {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
            audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(
            880, audioContext.currentTime
        );
        oscillator.frequency.exponentialRampToValueAtTime(
            660, audioContext.currentTime + 0.16
        );

        gain.gain.setValueAtTime(
            0.0001, audioContext.currentTime
        );
        gain.gain.exponentialRampToValueAtTime(
            0.22, audioContext.currentTime + 0.015
        );
        gain.gain.exponentialRampToValueAtTime(
            0.0001, audioContext.currentTime + 0.35
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.36);
    } catch (error) {
        console.warn("Could not play the timer sound.", error);
    }
}

// ==========================================
// TIMER ANIMATION
// Black curtain retreats DOWNWARD.
// The colored region grows from TOP to BOTTOM.
// ==========================================

function stopTimer() {
    timerRunning = false;

    if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }
}

function resetScreen() {
    stopTimer();

    timerFinished = false;
    curtain.style.height = "100%";
    colorBackground.style.backgroundColor = "rgb(40, 167, 69)";
    document.body.classList.remove("finished");

    hint.textContent = "Tap anywhere to start";
}

function startTimer() {
    stopTimer();

    timerRunning = true;
    timerFinished = false;
    startTime = performance.now();

    document.body.classList.remove("finished");
    hint.textContent = "Make the sound!";

    function animate(now) {
        if (!timerRunning) return;

        const elapsed = (now - startTime) / 1000;
        const progress = Math.min(elapsed / TURN_DURATION, 1);

        // At the start the curtain covers the whole screen.
        // As time passes, its bottom edge moves downward
        // and its height decreases.
        const remainingBlack = (1 - progress) * 100;

        curtain.style.height = remainingBlack + "%";
        colorBackground.style.backgroundColor =
            getTimerColor(progress);

        if (progress >= 1) {
            timerRunning = false;
            timerFinished = true;
            animationFrame = null;

            curtain.style.height = "0%";
            colorBackground.style.backgroundColor =
                "rgb(215, 25, 32)";

            document.body.classList.add("finished");
            hint.textContent = "TIME'S UP! Tap for the next sound";

            playDing();
            return;
        }

        animationFrame = requestAnimationFrame(animate);
    }

    animationFrame = requestAnimationFrame(animate);
}

// ==========================================
// NEXT PROMPT
// ==========================================

function nextWord() {
    resetScreen();
    drawPrompt();
    startTimer();
}

// ==========================================
// LEVEL SWITCHING
// ==========================================

levelBtn.addEventListener("click", (event) => {
    event.stopPropagation();

    level2 = !level2;

    if (level2) {
        prompts = level2Prompts;
        document.body.classList.add("level2");
        levelBtn.textContent = "Level 1";
    } else {
        prompts = level1Prompts;
        document.body.classList.remove("level2");
        levelBtn.textContent = "Level 2";
    }

    refillBag();
    nextWord();
});

// ==========================================
// TAP / CLICK TO ADVANCE
// ==========================================

document.body.addEventListener("click", (event) => {
    if (event.target === levelBtn) return;
    nextWord();
});

// Keyboard support
document.addEventListener("keydown", (event) => {
    if (event.code === "Space" || event.code === "ArrowRight") {
        event.preventDefault();
        nextWord();
    }
});

// ==========================================
// INITIAL STATE
// ==========================================

refillBag();
resetScreen();

</script>
