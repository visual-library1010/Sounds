<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Charades</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    cursor: pointer;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#word {
    width: 90%;
    font-size: clamp(3rem, 8vw, 8rem);
    font-weight: bold;
    line-height: 1.1;
    transition: opacity .15s, color .2s;
}

#hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 1rem;
    letter-spacing: 1px;
}

#levelBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: white;
    color: black;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
}

body.level2 #word {
    color: orange;
}
</style>
</head>

<body>

<button id="levelBtn">Level 2</button>

<div id="word"></div>
<div id="hint">Click • Space • → Next Sound</div>

<script>

// ==========================
// LEVEL 1
// ==========================

// ==========================

const word = document.getElementById("word");
const levelBtn = document.getElementById("levelBtn");

let prompts = level1Prompts;
let bag = [];
let level2 = false;

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function refillBag(){
    bag = [...prompts];
    shuffle(bag);
}

function nextWord(){

    if(bag.length===0){
        refillBag();
    }

    word.style.opacity = 0;

    setTimeout(()=>{
        word.textContent = bag.pop();
        word.style.opacity = 1;
    },120);

}

document.body.addEventListener("click", nextWord);

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space" || e.code==="ArrowRight"){
        e.preventDefault();
        nextWord();
    }

});

levelBtn.addEventListener("click",(e)=>{

    e.stopPropagation();

    level2 = !level2;

    if(level2){
        prompts = level2Prompts;
        document.body.classList.add("level2");
        levelBtn.textContent = "Level 1";
    }else{
        prompts = level1Prompts;
        document.body.classList.remove("level2");
        levelBtn.textContent = "Level 2";
    }

    refillBag();
    nextWord();

});

refillBag();
nextWord();

</script>

</body>
</html>
